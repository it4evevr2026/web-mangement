<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Hommkesa Coupon</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #7c4a2d;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .logo span { color: #c0874a; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      margin-top: 16px;
      text-align: center;
    }

    /* ---- Loading ---- */
    #screen-loading .spinner {
      width: 48px; height: 48px;
      border: 5px solid #f0e6d8;
      border-top-color: #c0874a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Confirm ---- */
    #screen-confirm .shop-name {
      font-size: 20px; font-weight: 700; color: #3d2000; margin-bottom: 8px;
    }
    #screen-confirm .discount-badge {
      display: inline-block;
      background: #c0874a;
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      border-radius: 14px;
      padding: 12px 28px;
      margin: 12px 0 20px;
    }
    #screen-confirm .note {
      font-size: 13px; color: #999; margin-bottom: 20px;
    }

    .btn {
      display: block; width: 100%;
      padding: 16px;
      border: none; border-radius: 14px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #c0874a; color: #fff; }
    .btn-secondary { background: #f0e6d8; color: #7c4a2d; margin-top: 10px; }

    /* ---- Success ---- */
    #screen-success .coupon-box {
      background: #fff9f2;
      border: 2px dashed #c0874a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    #screen-success .code-label {
      font-size: 13px; color: #999; margin-bottom: 4px;
    }
    #screen-success .code-value {
      font-size: 40px; font-weight: 800;
      letter-spacing: 8px; color: #3d2000;
      font-variant-numeric: tabular-nums;
    }
    #screen-success .discount-text {
      font-size: 18px; color: #c0874a; font-weight: 700; margin: 8px 0 4px;
    }
    #screen-success .shop-text {
      font-size: 14px; color: #888;
    }
    #qr-container {
      display: flex; justify-content: center;
      margin: 12px 0 6px;
    }
    #qr-container canvas, #qr-container img {
      border-radius: 8px;
    }
    .timer-bar-wrap {
      background: #f0e6d8; border-radius: 8px;
      height: 8px; margin: 10px 0 4px; overflow: hidden;
    }
    .timer-bar { height: 8px; background: #c0874a; border-radius: 8px; transition: width 1s linear; }
    .timer-text { font-size: 13px; color: #c0874a; font-weight: 600; }

    /* ---- Error ---- */
    #screen-error .icon { font-size: 48px; margin: 12px 0; }
    #screen-error .msg { font-size: 16px; color: #c0392b; margin-bottom: 20px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="logo">Hommk<span>esa</span> Coupon</div>

  <!-- Loading -->
  <div class="card" id="screen-loading">
    <div class="spinner"></div>
    <p style="color:#999;font-size:14px;">กำลังโหลด...</p>
  </div>

  <!-- Confirm -->
  <div class="card hidden" id="screen-confirm">
    <p style="color:#888;font-size:13px;margin-bottom:4px;">รับส่วนลดที่</p>
    <p class="shop-name" id="confirm-shop-name">—</p>
    <div class="discount-badge" id="confirm-discount">฿200</div>
    <p class="note">กดปุ่มด้านล่างเพื่อรับรหัสส่วนลด<br>รหัสมีอายุ <span id="expiry-label">20</span> นาที</p>
    <button class="btn btn-primary" id="btn-confirm">รับส่วนลด</button>
  </div>

  <!-- Success -->
  <div class="card hidden" id="screen-success">
    <p style="font-size:13px;color:#888;margin-bottom:10px;">แสดงรหัสนี้ให้พนักงาน</p>
    <div class="coupon-box">
      <p class="code-label">รหัสส่วนลด</p>
      <p class="code-value" id="result-code">——</p>
      <p class="discount-text" id="result-discount">ลด ฿200</p>
      <p class="shop-text" id="result-shop">—</p>
    </div>
    <div id="qr-container"></div>
    <p style="font-size:12px;color:#aaa;margin-bottom:6px;">หรือพนักงานสแกน QR ด้านบน</p>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar" style="width:100%"></div>
    </div>
    <p class="timer-text" id="timer-text">เหลือเวลา 20:00 นาที</p>
  </div>

  <!-- Error -->
  <div class="card hidden" id="screen-error">
    <div class="icon">⚠️</div>
    <p class="msg" id="error-msg">เกิดข้อผิดพลาด</p>
    <button class="btn btn-secondary" onclick="location.reload()">ลองใหม่</button>
  </div>

  <script>
    // ============================================================
    // CONFIG — เปลี่ยน URL ของ Apps Script ตรงนี้
    // ============================================================
    const API_URL = 'YOUR_APPS_SCRIPT_URL';

    // ============================================================
    const params  = new URLSearchParams(location.search);
    const shopId  = params.get('shop');

    let timerInterval = null;

    function show(id) {
      ['screen-loading','screen-confirm','screen-success','screen-error']
        .forEach(s => document.getElementById(s).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    async function api(params) {
      const url = API_URL + '?' + new URLSearchParams(params).toString();
      const res = await fetch(url);
      return res.json();
    }

    // ---- Load shop info ----
    async function loadShop() {
      if (!shopId) { showError('ไม่พบข้อมูลร้าน กรุณาสแกน QR ใหม่'); return; }
      try {
        const data = await api({ action: 'getShop', shop_id: shopId });
        if (!data.success) { showError(data.error || 'ไม่พบร้านนี้'); return; }

        document.getElementById('confirm-shop-name').textContent = data.shop.shop_name || data.shop_name;
        document.getElementById('confirm-discount').textContent  = `฿${data.shop.discount || data.discount}`;
        show('screen-confirm');
      } catch(e) {
        showError('ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
      }
    }

    // ---- Confirm button ----
    document.getElementById('btn-confirm').addEventListener('click', async () => {
      document.getElementById('btn-confirm').disabled = true;
      show('screen-loading');
      try {
        const data = await api({ action: 'generateCode', shop_id: shopId });
        if (!data.success) { showError(data.error || 'เกิดข้อผิดพลาด'); return; }
        showSuccess(data);
      } catch(e) {
        showError('ไม่สามารถสร้างรหัสได้ กรุณาลองใหม่');
      }
    });

    // ---- Show success + QR + timer ----
    function showSuccess(data) {
      const code     = data.code;
      const discount = data.discount;
      const shopName = data.shop_name;
      const expMins  = data.expiry_mins || 20;

      document.getElementById('result-code').textContent    = code;
      document.getElementById('result-discount').textContent = `ลด ฿${discount}`;
      document.getElementById('result-shop').textContent    = shopName;

      // สร้าง QR
      const qrContainer = document.getElementById('qr-container');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: code,
        width: 180, height: 180,
        colorDark: '#3d2000', colorLight: '#fff9f2',
        correctLevel: QRCode.CorrectLevel.M
      });

      // Timer
      startTimer(expMins * 60);
      show('screen-success');
    }

    function startTimer(totalSecs) {
      let remaining = totalSecs;
      if (timerInterval) clearInterval(timerInterval);

      function update() {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        const pct = (remaining / totalSecs) * 100;
        document.getElementById('timer-text').textContent =
          `เหลือเวลา ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} นาที`;
        document.getElementById('timer-bar').style.width = pct + '%';

        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer-text').textContent = 'รหัสหมดอายุแล้ว';
          document.getElementById('timer-bar').style.width = '0%';
          document.getElementById('timer-bar').style.background = '#e74c3c';
        }
        remaining--;
      }

      update();
      timerInterval = setInterval(update, 1000);
    }

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      show('screen-error');
    }

    // ---- Start ----
    loadShop();
  </script>
</body>
</html>
